apiVersion: v1
kind: Service
metadata:
  name: catalogo-cultivos
  namespace: agro
  labels:
    app.kubernetes.io/name: catalogo-cultivos
    app.kubernetes.io/part-of: agro-monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: catalogo-cultivos
  ports:
    - name: http          # el ServiceMonitor referencia este nombre
      port: 8081
      targetPort: http
      nodePort: 30081
