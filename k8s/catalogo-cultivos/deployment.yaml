apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-cultivos
  namespace: agro
  labels:
    app.kubernetes.io/name: catalogo-cultivos
    app.kubernetes.io/part-of: agro-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogo-cultivos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogo-cultivos
        app.kubernetes.io/part-of: agro-monitoring
    spec:
      containers:
        - name: catalogo-cultivos
          image: agro/catalogo-cultivos:1.0.0
          # La imagen se construye dentro del daemon Docker de Minikube
          # (minikube docker-env); "Never" evita que intente bajarla de un registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: RESPONSE_DELAY_MS
              value: "0"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:ActiveProcessorCount=2"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Da margen al arranque de Spring Boot (hasta 2 min) antes de que
          # empiece a contar la liveness probe.
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
