apiVersion: v1
kind: Service
metadata:
  name: gestion-cosechas
  namespace: agro
  labels:
    app.kubernetes.io/name: gestion-cosechas
    app.kubernetes.io/part-of: agro-monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gestion-cosechas
  ports:
    - name: http          # el ServiceMonitor referencia este nombre
      port: 8082
      targetPort: http
      nodePort: 30082
