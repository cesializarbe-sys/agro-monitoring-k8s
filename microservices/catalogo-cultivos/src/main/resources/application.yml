server:
  port: 8081

spring:
  application:
    name: catalogo-cultivos

app:
  delay-ms: ${RESPONSE_DELAY_MS:0}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: catalogo-cultivos
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.cesia.catalogocultivos: INFO
